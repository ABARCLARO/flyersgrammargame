<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flyers Quest – Reading & Writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --sky:#cfefff; --sky2:#f2fbff; --card:#ffffff; --ink:#27204d; --muted:#5f5a86; --line:#dfe6f5;
  --sun:#ffd23f; --gum:#ff5fa2; --grape:#7c4ddb; --leaf:#22b573; --tang:#ff9f1c; --ocean:#2f80ed; --coral:#f25c54;
  --good-bg:#e3f9ee; --fix-bg:#fff1e0; --chip:#eef1fb; --input:#f7f9ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#16204a; --sky2:#0f1736; --card:#232c5c; --ink:#f4f2ff; --muted:#b8b6e3; --line:#34407a;
    --good-bg:#15432f; --fix-bg:#4a321a; --chip:#2f3972; --input:#1b2450;
  }
}
:root[data-theme="dark"]{
  --sky:#16204a; --sky2:#0f1736; --card:#232c5c; --ink:#f4f2ff; --muted:#b8b6e3; --line:#34407a;
  --good-bg:#15432f; --fix-bg:#4a321a; --chip:#2f3972; --input:#1b2450;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;color:var(--ink);
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%);
  font-family:'Andika','Trebuchet MS',Verdana,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--ocean);outline-offset:3px}
.display{font-family:'Baloo 2','Trebuchet MS',sans-serif}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--card);border-bottom:4px solid var(--line)}
.brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(22px,3.4vw,30px);color:var(--grape);line-height:1;display:flex;align-items:center;gap:8px}
.iconbtn{min-width:54px;min-height:54px;border-radius:18px;font-size:26px;background:var(--chip);border:none;display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}
.starpill{display:flex;align-items:center;gap:6px;background:var(--sun);color:#3b2a00;font-weight:700;font-size:22px;border-radius:999px;padding:8px 16px;min-height:50px}
.starpill.pop{animation:pop .45s}

.wrap{max-width:1040px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:26px;padding:18px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}

/* Owl coach */
.coach{display:flex;align-items:center;gap:10px}
.coach svg{flex:none;width:clamp(62px,11vw,88px);height:auto;animation:bob 3.2s ease-in-out infinite}
.coach.bounce svg{animation:hop .55s}
.bubble{position:relative;background:var(--card);border:3px solid var(--grape);border-radius:22px;padding:10px 16px;font-weight:700;font-size:clamp(17px,2.3vw,21px);line-height:1.35}
.bubble::before{content:"";position:absolute;left:-13px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--grape);border-left:0}

/* Buttons */
.btn{min-height:58px;padding:0 24px;border-radius:20px;font-weight:700;font-size:21px;border:none;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn-blue{background:var(--ocean);color:#fff}
.btn-pink{background:var(--gum);color:#fff}
.btn-soft{background:var(--chip);color:var(--ink)}

.opt{min-height:76px;font-size:clamp(23px,3vw,29px);font-weight:700;border-radius:22px;background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);padding:8px 14px;transition:transform .08s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.right{background:var(--leaf);color:#fff;border-color:var(--leaf);box-shadow:0 6px 0 #178a57;animation:pop .45s}
.opt.wrong{background:var(--coral);color:#fff;border-color:var(--coral);box-shadow:0 6px 0 #b8403a;animation:shake .45s}
.opt.dim{opacity:.4}

/* Part 4 */
.sentence{font-size:clamp(23px,3.3vw,33px);line-height:1.65;font-weight:700}
.blank{display:inline-block;min-width:118px;text-align:center;border-bottom:5px dashed var(--grape);color:var(--grape);padding:0 10px;margin:0 2px}
.blank.ok{background:var(--good-bg);color:var(--leaf);border-bottom-color:var(--leaf);border-radius:12px 12px 0 0}
.blank.fix{background:var(--fix-bg);color:var(--tang);border-bottom-color:var(--tang);border-radius:12px 12px 0 0}
.clue{border-radius:10px;padding:0 4px;transition:background .3s,color .3s}
.show-clue .clue{background:var(--sun);color:#3b2a00}
.cluebtn{margin-top:14px;min-height:50px;padding:0 18px;border-radius:16px;background:var(--chip);color:var(--ink);font-weight:700;font-size:18px;border:none}

/* Progress */
.ptitle{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,3.4vw,32px);line-height:1.1}
.scorepill{background:var(--card);border:3px solid var(--sun);border-radius:999px;padding:6px 16px;font-weight:700;font-size:20px}
.prog{height:18px;background:var(--card);border:3px solid var(--line);border-radius:999px;overflow:hidden}
.prog>div{height:100%;background:linear-gradient(90deg,var(--leaf),var(--sun));border-radius:999px;transition:width .5s}

/* Part 6 */
.storytitle{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(22px,3vw,28px);margin-bottom:6px}
.storytext{font-size:clamp(19px,2.5vw,24px);line-height:2.05;font-weight:400}
.gap{display:inline-flex;align-items:center;gap:6px;min-width:100px;min-height:48px;margin:2px 3px;padding:0 12px 0 6px;border-radius:14px;border:3px dashed var(--grape);background:var(--chip);color:var(--ink);font-weight:700;font-size:inherit;vertical-align:middle;line-height:1.2}
.gap.cur{border-style:solid;border-color:var(--gum);animation:glow 1.5s ease-in-out infinite}
.gap.ok{border-style:solid;border-color:var(--leaf);background:var(--good-bg);color:var(--leaf)}
.gap.fix{border-style:solid;border-color:var(--tang);background:var(--fix-bg);color:var(--tang)}
.gapnum{background:var(--grape);color:#fff;border-radius:999px;min-width:28px;height:28px;display:inline-grid;place-items:center;font-size:16px}
.gap.ok .gapnum{background:var(--leaf)} .gap.fix .gapnum{background:var(--tang)}
.lbl{font-weight:700;font-size:19px;color:var(--muted);margin-bottom:8px}
.typein{flex:1;min-width:0;font-size:22px;min-height:58px;border-radius:18px;border:3px solid var(--line);padding:0 16px;background:var(--input);color:var(--ink);font-weight:700;font-family:inherit}
.typein:focus{outline:none;border-color:var(--ocean)}
.typein.shake{animation:shake .4s;border-color:var(--coral)}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{min-height:58px;min-width:96px;padding:0 20px;border-radius:18px;font-size:23px;font-weight:700;background:var(--sun);color:#3b2a00;border:none;box-shadow:0 5px 0 #d6a800}
.chip:active{transform:translateY(4px);box-shadow:0 1px 0 #d6a800}

/* Part 5 */
.toggle{min-height:58px;padding:0 20px;border-radius:999px;font-weight:700;font-size:19px;background:var(--card);color:var(--ink);border:3px solid var(--grape);box-shadow:0 4px 0 var(--grape)}
.toggle.on{background:var(--grape);color:#fff}
.toggle:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grape)}
.vb{border-radius:9px;transition:background .25s,color .25s,padding .25s}
.vb.on{background:var(--c);color:#fff;padding:1px 7px}
.vb.on.focus{box-shadow:0 0 0 3px var(--sun);animation:pulse 1.3s ease-in-out infinite}
.tag{display:inline-block;font-weight:700;font-size:16px;border-radius:999px;padding:4px 14px;margin-bottom:8px}
.now-tag{background:#d9ebff;color:#1c56b8}
.past-tag{background:#ffe7a8;color:#7a4b00}
.question{font-size:clamp(21px,2.8vw,27px);font-weight:700;line-height:1.6}
.bridge{display:none;margin-top:14px;padding:12px;border-radius:18px;background:var(--chip);flex-direction:column;gap:10px}
.bridge.show{display:flex;animation:up .3s}
.brow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:700}
.bw{background:var(--c);color:#fff;border-radius:12px;padding:4px 12px;font-size:20px}
.arrow{font-size:24px}
.qnote{font-size:16px;color:var(--muted)}
.didtip{font-size:17px;font-weight:700}

/* Dashboard */
.game{text-align:left;border-radius:30px;padding:20px;color:#fff;border:none;min-height:180px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 0 rgba(0,0,0,.2);transition:transform .08s}
.game:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.game .emo{font-size:48px;line-height:1}
.game .gt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;line-height:1.05}
.game .gp{font-weight:700;font-size:16px;opacity:.92;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 12px;align-self:flex-start}
.game .gd{font-size:18px;line-height:1.3}
.game .best{margin-top:auto;font-weight:700;font-size:17px}
.g4{background:linear-gradient(135deg,#ff5fa2,#ff9f1c)}
.g6{background:linear-gradient(135deg,#2f80ed,#14b8a6)}
.g5{background:linear-gradient(135deg,#7c4ddb,#ff5fa2)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.slot{background:var(--chip);border-radius:20px;padding:10px 6px;font-weight:700;font-size:15px}
.slot .t{font-size:40px;line-height:1.2}
.nameIn{font-size:20px;min-height:52px;border-radius:16px;border:3px solid var(--line);padding:0 14px;background:var(--input);color:var(--ink);font-weight:700;font-family:inherit;width:100%;max-width:260px}

/* Summary */
.trophy{font-size:clamp(90px,16vw,140px);line-height:1;animation:hop 1s}
.starrow{font-size:clamp(24px,3.4vw,32px);letter-spacing:2px;word-break:break-all}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(25,18,60,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#modal.show{display:flex}
@media (min-width:768px){#modal{align-items:center}}
.sheet{width:100%;max-width:660px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:30px;animation:up .3s}
.sheet-head{padding:14px 22px;font-family:'Baloo 2',sans-serif;font-size:28px;font-weight:800;color:#fff}
.ok .sheet-head{background:var(--leaf)}
.no .sheet-head{background:var(--tang)}
.sheet-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.sheet-body svg{flex:none;width:70px;height:auto}
.helperlbl{font-weight:700;font-size:16px;color:var(--muted)}
.rulechip{display:inline-block;background:var(--sun);color:#3b2a00;border-radius:999px;padding:6px 16px;font-weight:700;font-size:19px;margin:4px 0 8px}
.explain{font-size:clamp(19px,2.5vw,23px);line-height:1.5}
.explain b{color:var(--gum)}
.answerline{font-size:20px;font-weight:700;background:var(--chip);border-radius:16px;padding:10px 14px}

/* Confetti */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.conf{position:absolute;top:-60px;animation-name:fall;animation-timing-function:ease-in;animation-fill-mode:forwards}

@keyframes fall{to{transform:translateY(115vh) rotate(560deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16px) scale(1.06)}70%{transform:translateY(0) scale(.97)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,95,162,.5)}50%{box-shadow:0 0 0 7px rgba(255,95,162,0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--sun)}50%{box-shadow:0 0 0 6px var(--sun)}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="h-full flex flex-col">
  <header class="topbar">
    <button id="homeBtn" class="iconbtn" aria-label="Go to menu" style="visibility:hidden">🏠</button>
    <div class="brand">🪁 Flyers Quest</div>
    <div class="flex items-center gap-2">
      <div class="starpill" id="starPill" aria-label="Total stars">⭐ <span id="starCount">0</span></div>
      <button id="muteBtn" class="iconbtn" aria-label="Sound on or off">🔊</button>
    </div>
  </header>
  <main id="screen" class="flex-1 overflow-y-auto"></main>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="fx"></div>

<script>
/* ============ DATA ============ */
const P4 = [
 {s:"Often [[firefighters]] ___ people get out of burning buildings.",o:["help","helps","helping"],a:0,rule:"More than one ➜ no -s",e:"<b>Firefighters</b> is plural (more than one), so we use the action word <b>without an s</b> ➜ <b>help</b>!"},
 {s:"[[My grandmother]] ___ to the market [[every Sunday]].",o:["go","goes","going"],a:1,rule:"He / She / It ➜ add -s",e:"<b>My grandmother</b> is just one person (she). It happens <b>every Sunday</b>, so we add <b>-es</b> ➜ <b>goes</b>!"},
 {s:"Look! The monkeys [[are]] ___ bananas [[right now]].",o:["eat","eats","eating"],a:2,rule:"am / is / are + -ing",e:"After <b>are</b>, and with <b>right now</b>, the action is happening at this moment. Add <b>-ing</b> ➜ <b>eating</b>!"},
 {s:"[[Yesterday]], Katy ___ a picture of a dragon.",o:["draws","drew","drawing"],a:1,rule:"Yesterday ➜ past",e:"<b>Yesterday</b> is in the past! <b>Draw</b> is a special verb — its past is <b>drew</b>."},
 {s:"Richard [[can]] ___ really fast in the sea.",o:["swim","swims","swimming"],a:0,rule:"can + plain verb",e:"After <b>can</b>, the action word stays plain and simple — no -s, no -ing ➜ <b>swim</b>!"},
 {s:"[[Does]] your brother ___ in the school band?",o:["play","plays","playing"],a:0,rule:"Does + plain verb",e:"<b>Does</b> already has the s (do ➜ does), so the action word doesn't need one ➜ <b>play</b>!"},
 {s:"[[Every morning]], [[the sun]] ___ over the hills.",o:["rise","rises","rising"],a:1,rule:"It + every day ➜ add -s",e:"<b>The sun</b> is one thing (it). It happens <b>every morning</b>, so we add <b>-s</b> ➜ <b>rises</b>!"},
 {s:"I really [[enjoy]] ___ stories about space.",o:["read","reads","reading"],a:2,rule:"enjoy + -ing",e:"After <b>enjoy</b> (and <b>like</b>, <b>love</b>), we use the <b>-ing</b> word ➜ <b>reading</b>!"},
 {s:"We ___ a big castle [[last summer]].",o:["visit","visits","visited"],a:2,rule:"last summer ➜ past -ed",e:"<b>Last summer</b> is finished — that's the past! Add <b>-ed</b> ➜ <b>visited</b>."},
 {s:"[[My cat]] ___ like water. She hates baths!",o:["don't","doesn't","isn't"],a:1,rule:"He / She / It ➜ doesn't",e:"<b>My cat</b> is one animal (she), so we use <b>doesn't</b>. (I, you, we, they ➜ don't.)"},
 {s:"Tomorrow we are [[going to]] ___ a chocolate cake.",o:["bake","bakes","baking"],a:0,rule:"going to + plain verb",e:"After <b>going to</b>, use the plain action word ➜ <b>bake</b>!"},
 {s:"[[Mr Brown]] ___ teaching maths [[at the moment]].",o:["is","are","do"],a:0,rule:"He / She ➜ is + -ing",e:"<b>Mr Brown</b> is one person (he), and it's happening <b>at the moment</b> ➜ <b>is</b> teaching!"},
 {s:"[[My friends and I]] often ___ football after school.",o:["play","plays","playing"],a:0,rule:"We ➜ no -s",e:"<b>My friends and I</b> = <b>we</b> (more than one person), so no s ➜ <b>play</b>!"},
 {s:"[[Penguins]] ___ fly, but they are great swimmers.",o:["can't","doesn't","isn't"],a:0,rule:"can't + plain verb",e:"<b>Penguins</b> is plural, so <b>doesn't</b> is wrong, and <b>isn't fly</b> is wrong too. We say <b>can't</b> fly!"}
];

const P6 = [
 {title:"A Day at the Zoo 🦁",
  text:"Last Saturday, Harry went to the zoo {0} his dad. First, they saw {1} elephant with a very long trunk. When they got to the lions, the zookeeper {2} feeding them. Harry asked, “{3} lions eat vegetables?” The zookeeper laughed. “No! {4} only eat meat!”",
  blanks:[
   {a:"with",o:["with","on","at"],rule:"go with + a person",e:"We go somewhere <b>with</b> a person ➜ to the zoo <b>with</b> his dad."},
   {a:"an",o:["a","an","the"],rule:"an + a, e, i, o, u sound",e:"<b>Elephant</b> starts with an <b>e</b> sound, so we say <b>an</b> elephant — like <b>an</b> apple!"},
   {a:"was",o:["was","were","is"],rule:"one person, past ➜ was",e:"The story is in the past, and <b>the zookeeper</b> is one person ➜ <b>was</b> feeding."},
   {a:"Do",o:["Do","Does","Are"],rule:"They / plural + Do …?",e:"<b>Lions</b> is plural and the question has the plain verb <b>eat</b>, so we start with <b>Do</b>."},
   {a:"They",o:["They","Them","Their"],rule:"Start of sentence ➜ They",e:"We need a word for <b>the lions</b> at the start of the sentence ➜ <b>They</b> only eat meat."}]},
 {title:"My Rabbit Snowy 🐰",
  text:"I have a white rabbit. {0} name is Snowy. She lives {1} a little wooden house in our garden. Every morning, I give {2} fresh carrots. Snowy {3} like loud noises, so we are always quiet near her house. I think she is {4} best pet in the world!",
  blanks:[
   {a:"Her",o:["Her","She","His"],rule:"belongs to a girl ➜ her",e:"The name belongs to Snowy, and Snowy is a girl rabbit ➜ <b>Her</b> name."},
   {a:"in",o:["in","at","to"],rule:"inside ➜ in",e:"Snowy is inside the little house ➜ she lives <b>in</b> a house."},
   {a:"her",o:["her","she","hers"],rule:"give + her",e:"After <b>give</b>, we say <b>her</b>, not she ➜ I give <b>her</b> carrots."},
   {a:"doesn't",alt:["does not","doesnt"],o:["doesn't","don't","isn't"],rule:"She ➜ doesn't + verb",e:"Snowy = <b>she</b>, so we use <b>doesn't</b> + like."},
   {a:"the",o:["the","a","an"],rule:"the + best",e:"Before <b>best</b> (number one!), we always use <b>the</b> ➜ <b>the</b> best pet."}]},
 {title:"The Space Museum 🚀",
  text:"There {0} lots of rockets at the space museum. Emma and Sally went there {1} Tuesday. Emma loves rockets, {2} she wants to be an astronaut. “What {3} you want to be?” she asked Sally. “I want to {4} a scientist!” said Sally.",
  blanks:[
   {a:"are",o:["are","is","be"],rule:"There are + plural",e:"<b>Lots of rockets</b> is plural (more than one) ➜ There <b>are</b>."},
   {a:"on",o:["on","in","at"],rule:"on + day of the week",e:"Days of the week use <b>on</b> ➜ <b>on</b> Tuesday, <b>on</b> Monday."},
   {a:"so",o:["so","but","or"],rule:"so = that's why",e:"She loves rockets — that's why she wants to be an astronaut ➜ <b>so</b>."},
   {a:"do",o:["do","does","are"],rule:"you + do",e:"<b>You</b> + want ➜ What <b>do</b> you want?"},
   {a:"be",o:["be","is","being"],rule:"want to + plain verb",e:"After <b>want to</b>, use the plain verb ➜ want to <b>be</b>."}]}
];

const P5 = [
 {title:"Paul's Camping Night 🏕️",
  text:"Paul {lives#live} in a small village near a forest. Every summer, he {goes#go} camping with his uncle. This year, they {take#take} a new tent. It {is#be} big and green. On the first night, Paul {hears#hear} a strange noise outside. He {sees#see} two bright eyes in the dark! His uncle {laughs#laugh} and {says#say}, “Don't worry! It's only an owl. Owls {make#make} funny noises at night.”",
  pairs:{live:{now:"lives",past:"lived"},go:{now:"goes",past:"went"},take:{now:"take",past:"took"},be:{now:"is",past:"was"},hear:{now:"hears",past:"heard",q:"did … hear"},see:{now:"sees",past:"saw",q:"did … see"},laugh:{now:"laughs",past:"laughed"},say:{now:"says",past:"said"},make:{now:"make",past:"made"}},
  qs:[
   {q:"Who {went#go} camping with Paul?",o:["his uncle","his dad","his teacher"],a:0,k:"go",say:"Paul <b>went</b> camping with <b>his uncle</b>."},
   {q:"What colour {was#be} the new tent?",o:["green","red","blue"],a:0,k:"be",say:"The tent <b>was</b> big and <b>green</b>."},

const $ = s => document.querySelector(s);

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const KEY='flyersQuest.v1';

/* ============ SOUND ============ */
let ctx=null;
function ac(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)() }catch(e){ ctx=null } } if(ctx&&ctx.state==="suspended") ctx.resume(); return ctx; }
function tone(f,t0,dur,type="triangle",vol=.16){
  if(DB.muted) return; const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sfx={
  tap(){tone(660,0,.08,"triangle",.07)},
  pop(){tone(880,0,.07,"sine",.1);tone(1320,.06,.08,"sine",.07)},
  good(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25))},
  bad(){tone(330,0,.2,"sine",.12);tone(262,.17,.3,"sine",.12)},
  win(){[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.32))}
};

/* ============ VISUAL FX ============ */
function burst(n=24){
  const fx=$("#fx"), em=["⭐","🌟","✨","🎉","💛","🎈"];
  for(let i=0;i<n;i++){
    const s=document.createElement("span"); s.className="conf"; s.textContent=em[i%em.length];
    s.style.left=(Math.random()*100)+"vw"; s.style.fontSize=(22+Math.random()*24)+"px";
    s.style.animationDuration=(1.3+Math.random()*1.2)+"s"; s.style.animationDelay=(Math.random()*.3)+"s";
    fx.appendChild(s); setTimeout(()=>s.remove(),3000);
  }
}
function owl(mood="happy"){

    ${mood==="happy"?'<circle cx="20" cy="58" r="5" fill="#ff8fc0" opacity=".8"/><circle cx="80" cy="58" r="5" fill="#ff8fc0" opacity=".8"/>':''}
    <path d="M38 105 l-4 6 M42 105 v7 M46 105 l4 6 M58 105 l-4 6 M62 105 v7 M66 105 l4 6" stroke="#ff9f1c" stroke-width="3.5" stroke-linecap="round"/>
  </svg>`;
}
const coach=(text,mood="happy")=>`<div class="coach">${owl(mood)}<div class="bubble">${text}</div></div>`;
function setCoach(text,mood){ const c=$("#coach"); if(!c) return; c.innerHTML=coach(text,mood); c.firstElementChild.classList.add("bounce"); }

function screen(html){ const m=$("#screen"); m.innerHTML=`<div class="wrap">${html}</div>`; m.scrollTop=0; }
function updateStars(popIt){ $("#starCount").textContent=DB.stars; if(popIt){ const p=$("#starPill"); p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop"); } }
function addStar(){ DB.stars++; saveDB(); updateStars(true); }
function header(title,done,total){

}
function showModal({ok,rule,body,extra="",btn="Next ➜",next}){

/* ============ PART 4 ============ */
function startP4(){
  S={part:"p4",items:shuffle(P4).slice(0,10),idx:0,score:0,total:10};
  $("#homeBtn").style.visibility="visible"; renderP4();
}
function renderP4(){
  const q=S.items[S.idx]; S.answered=false;
  const sent=q.s.replace(/\[\[(.+?)\]\]/g,'<span class="clue">$1</span>').replace("___",'<span class="blank" id="blank">?</span>');
  const opts=shuffle(q.o.map((t,i)=>({t,i})));
  screen(`${header("🔍 Verb Detective",S.idx,S.total)}
    <div id="coach">${coach(S.idx===0?"Read the whole sentence. Look for the clue words! 🔍":`Question ${S.idx+1}. You can do it! 💪`)}</div>
    <div class="card"><div class="sentence" id="sent">${sent}</div>
      <button class="cluebtn" id="clueBtn">💡 Show me the clue</button></div>
    <div class="grid gap-3 sm:grid-cols-3">${opts.map(o=>`<button class="opt" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div>`);
  $("#clueBtn").onclick=()=>{ sfx.pop(); $("#sent").classList.add("show-clue"); setCoach("Look at the yellow words. Who? When? 🤔","think"); };
  $$(".opt").forEach(b=>b.onclick=()=>answerP4(+b.dataset.i,b));
}
function answerP4(i,btn){
  if(S.answered) return; S.answered=true;
  const q=S.items[S.idx], ok=i===q.a;
  $$(".opt").forEach(b=>{ b.disabled=true; const bi=+b.dataset.i; if(bi===q.a) b.classList.add("right"); else if(b===btn) b.classList.add("wrong"); else b.classList.add("dim"); });
  const bl=$("#blank"); bl.textContent=q.o[q.a]; bl.classList.add(ok?"ok":"fix");
  $("#sent").classList.add("show-clue"); $("#clueBtn").style.display="none";
  if(ok){ S.score++; addStar(); sfx.good(); burst(18); } else sfx.bad();
  setCoach(ok?pick(GOOD):pick(BAD), ok?"happy":"think");
  setTimeout(()=>showModal({ok,rule:q.rule,body:q.e,
    extra:ok?"":`<div class="answerline">✅ The answer is: <b style="color:var(--leaf)">${esc(q.o[q.a])}</b></div>`,
    btn:S.idx+1<S.items.length?"Next question ➜":"See my trophy 🏆",
    next:()=>{ S.idx++; S.idx<S.items.length?renderP4():summary(); }}),700);
}

/* ============ PART 6 ============ */
function startP6(){
  S={part:"p6",sIdx:0,score:0,total:P6.reduce((a,s)=>a+s.blanks.length,0)};
  $("#homeBtn").style.visibility="visible"; loadStory6();
}
function loadStory6(){
  const st=P6[S.sIdx]; S.fill=st.blanks.map(()=>null); S.cur=0; S.order=st.blanks.map(b=>shuffle(b.o)); renderP6(true);
}
function renderP6(first){
  const st=P6[S.sIdx];
  const done=P6.slice(0,S.sIdx).reduce((a,s)=>a+s.blanks.length,0)+S.fill.filter(Boolean).length;
  const text=st.text.replace(/\{(\d)\}/g,(m,n)=>{ n=+n; const f=S.fill[n];
    const cls=f?(f.ok?"gap ok":"gap fix"):(n===S.cur?"gap cur":"gap");
    return `<button class="${cls}" data-n="${n}" ${f?"disabled":""} aria-label="Gap ${n+1}"><span class="gapnum">${n+1}</span>${f?esc(f.word):"&nbsp;"}</button>`; });
  screen(`${header("🧱 Word Builder",done,S.total)}
    <div id="coach">${coach(first?`Story ${S.sIdx+1} of ${P6.length}! Type the missing word, or tap one. ✏️`:"Which little word fits? Read the words around the gap! 👀")}</div>
    <div class="card"><div class="storytitle">${st.title}</div><p class="storytext">${text}</p></div>
    <div class="card">
      <div class="lbl">Gap ${S.cur+1}: type the missing word</div>
      <div class="flex gap-3">
        <input id="typeIn" class="typein" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Type here…" aria-label="Missing word">
        <button id="checkBtn" class="btn btn-pink">Check ✓</button>
      </div>
      <div class="lbl" style="margin-top:14px">…or tap a word:</div>
      <div class="chips">${S.order[S.cur].map(w=>`<button class="chip" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>
    </div>`);
  $$(".gap:not([disabled])").forEach(g=>g.onclick=()=>{ sfx.tap(); S.cur=+g.dataset.n; renderP6(); });
  const inp=$("#typeIn");
  const check=()=>{ const v=inp.value.trim(); if(!v){ inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); return; } inp.blur(); answerP6(v); };
  $("#checkBtn").onclick=check;
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); } };
  $$(".chip").forEach(c=>c.onclick=()=>answerP6(c.dataset.w));
}
function answerP6(word){
  if(S.busy) return; S.busy=true;
  const st=P6[S.sIdx], n=S.cur, b=st.blanks[n];
  const norm=w=>w.trim().toLowerCase().replace(/[’‘]/g,"'");
  const ok=[b.a,...(b.alt||[])].map(norm).includes(norm(word));
  S.fill[n]={word:b.a,ok};
  if(ok){ S.score++; addStar(); sfx.good(); burst(16); } else sfx.bad();
  const nextGap=S.fill.findIndex(f=>!f);
  const storyDone=nextGap===-1, allDone=storyDone&&S.sIdx+1>=P6.length;
  if(!storyDone) S.cur=nextGap;
  renderP6();
  $$(".chip,#checkBtn,#typeIn").forEach(el=>el.disabled=true);
  setCoach(ok?pick(GOOD):pick(BAD), ok?"happy":"think");
  setTimeout(()=>{ S.busy=false; showModal({ok,rule:b.rule,body:b.e,
    extra:ok?"":`<div class="answerline">You wrote: <b>${esc(word)}</b><br>✅ The answer is: <b style="color:var(--leaf)">${esc(b.a)}</b></div>`,
    btn:allDone?"See my trophy 🏆":storyDone?"Next story 📖":"Next gap ➜",
    next:()=>{ if(!storyDone) renderP6(); else if(!allDone){ S.sIdx++; loadStory6(); } else summary(); }}); },650);
}

/* ============ PART 5 ============ */
function startP5(){
  S={part:"p5",sIdx:0,qIdx:0,score:0,total:P5.reduce((a,s)=>a+s.qs.length,0),helper:S.helper||false};
  $("#homeBtn").style.visibility="visible"; renderP5();
}
const tagVerbs=str=>str.replace(/\{([^#}]+)#([^}]+)\}/g,'<span class="vb" data-k="$2">$1</span>');
function colorFor(st,k){ return COLORS[Object.keys(st.pairs).indexOf(k)%COLORS.length]; }
function renderP5(){
  const st=P5[S.sIdx], q=st.qs[S.qIdx]; S.answered=false;
  const keys=[...new Set([...q.q.matchAll(/#([^}]+)\}/g)].map(m=>m[1]))];
  const hasDid=/\{did#/.test(q.q);
  const bridge=keys.map(k=>{ const p=st.pairs[k], c=colorFor(st,k);
    return `<div class="brow"><span class="bw" style="--c:${c}">📖 ${p.now}</span><span class="arrow">➜</span><span class="bw" style="--c:${c}">🕰️ ${p.past}</span>${p.q?`<span class="qnote">the question says <b>${p.q}</b></span>`:""}</div>`; }).join("");
  const done=P5.slice(0,S.sIdx).reduce((a,s)=>a+s.qs.length,0)+S.qIdx;
  const opts=shuffle(q.o.map((t,i)=>({t,i})));
  screen(`${header("⏰ Tense Time Machine",done,S.total)}
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div id="coach">${coach(S.qIdx===0?"The story happens NOW. The questions ask about the PAST! 🕰️":"Find the same action in the story! 🔎")}</div>
      <button id="helperBtn" class="toggle ${S.helper?"on":""}" aria-pressed="${S.helper}">🔮 Tense Helper: <b>${S.helper?"ON":"OFF"}</b></button>
    </div>
    <div class="grid md:grid-cols-2 gap-4 items-start">
      <div class="card"><span class="tag now-tag">📖 Story — happening now</span>
        <div class="storytitle">${st.title}</div><p class="storytext" id="storyText">${tagVerbs(st.text)}</p></div>
      <div class="flex flex-col gap-3">
        <div class="card"><span class="tag past-tag">❓ Question ${S.qIdx+1} of ${st.qs.length} — in the past</span>
          <p class="question">${tagVerbs(q.q)}</p>
          <div class="bridge" id="bridge">${bridge}${hasDid?'<div class="didtip">💡 <b>did</b> + plain verb = a past question!</div>':""}</div>
        </div>
        <div class="grid gap-3">${opts.map(o=>`<button class="opt" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div>
      </div>
    </div>`);
  applyHelper(keys);
  $("#helperBtn").onclick=()=>{ S.helper=!S.helper; sfx.pop();
    const b=$("#helperBtn"); b.classList.toggle("on",S.helper); b.setAttribute("aria-pressed",S.helper); b.innerHTML=`🔮 Tense Helper: <b>${S.helper?"ON":"OFF"}</b>`;
    applyHelper(keys);
    if(S.helper) setCoach("Same colour = same action! Story word is NOW, question word is PAST. ✨","happy"); };
  $$(".opt").forEach(b=>b.onclick=()=>answerP5(+b.dataset.i,b));
}
function applyHelper(keys){
  const st=P5[S.sIdx];
  $$(".vb").forEach(el=>{ el.style.setProperty("--c",colorFor(st,el.dataset.k)); el.classList.toggle("on",!!S.helper);
    el.classList.toggle("focus",!!S.helper && el.closest("#storyText") && keys.includes(el.dataset.k)); });
  const br=$("#bridge"); if(br) br.classList.toggle("show",!!S.helper);
}
function answerP5(i,btn){
  if(S.answered) return; S.answered=true;
  const st=P5[S.sIdx], q=st.qs[S.qIdx], ok=i===q.a, p=st.pairs[q.k];
  $$(".opt").forEach(b=>{ b.disabled=true; const bi=+b.dataset.i; if(bi===q.a) b.classList.add("right"); else if(b===btn) b.classList.add("wrong"); else b.classList.add("dim"); });
  if(!S.helper){ S.helper=true; const hb=$("#helperBtn"); hb.classList.add("on"); hb.innerHTML="🔮 Tense Helper: <b>ON</b>"; applyHelper([q.k]); }
  if(ok){ S.score++; addStar(); sfx.good(); burst(18); } else sfx.bad();
  setCoach(ok?pick(GOOD):pick(BAD), ok?"happy":"think");
  const lastQ=S.qIdx+1>=st.qs.length, lastStory=S.sIdx+1>=P5.length;
  setTimeout(()=>showModal({ok,rule:`${p.now} ➜ ${p.past}`,
    body:`In the story (now): <b>${p.now}</b>.<br>In the question (past): <b>${p.q||p.past}</b>.<br>Same action — different time!`,
    extra:`<div class="answerline">✅ ${q.say}</div>`,
    btn:lastQ&&lastStory?"See my trophy 🏆":lastQ?"Next story 📖":"Next question ➜",
    next:()=>{ S.qIdx++; if(S.qIdx>=st.qs.length){ S.qIdx=0; S.sIdx++; } S.sIdx<P5.length?renderP5():summary(); }}),700);
}

/* ============ SUMMARY ============ */
function summary(){
  const pct=S.score/S.total;
  const t=pct>=.8?{k:3,n:"Gold Trophy",m:"You're a Flyers champion!"}
         :pct>=.6?{k:2,n:"Silver Trophy",m:"Great work! Gold is very close!"}
         :pct>=.4?{k:1,n:"Bronze Trophy",m:"Good job! Practise again to shine brighter!"}
         :{k:0,n:"Brave Learner Badge",m:"Every try makes your brain stronger!"};
  const prev=DB.best[S.part];
  if(!prev||S.score/S.total>prev.score/prev.total){ DB.best[S.part]={k:t.k,score:S.score,total:S.total}; saveDB(); }
  sfx.win(); burst(40);
  const part=S.part;
  screen(`<div class="card text-center flex flex-col items-center gap-3" style="padding:26px 18px">
    <div class="trophy">${trophyFor(t.k)}</div>
    <h1 class="ptitle">${t.n}!</h1>
    <p style="font-size:22px;font-weight:700">${PARTS[part].emoji} ${PARTS[part].name}: <b>${S.score}</b> out of <b>${S.total}</b></p>
    <div class="starrow">${"⭐".repeat(S.score)}${"☆".repeat(S.total-S.score)}</div>
    <div id="coach" class="text-left">${coach(`${t.m} ${PARTS[part].tip}`)}</div>
    <div class="flex flex-wrap gap-3 justify-center mt-2">
      <button class="btn btn-pink" id="againBtn">🔁 Play again</button>
      <button class="btn btn-soft" id="menuBtn">🏠 Choose a game</button>
    </div></div>`);
  $("#againBtn").onclick=()=>{ sfx.pop(); ({p4:startP4,p6:startP6,p5:startP5})[part](); };
  $("#menuBtn").onclick=()=>{ sfx.tap(); home(); };
}

/* ============ INIT ============ */
$("#homeBtn").onclick=()=>{ sfx.tap(); $("#modal").classList.remove("show"); home(); };
const mb=$("#muteBtn");
const setMuteIcon=()=>{ mb.textContent=DB.muted?"🔇":"🔊"; };
mb.onclick=()=>{ DB.muted=!DB.muted; saveDB(); setMuteIcon(); sfx.tap(); };
setMuteIcon(); updateStars(); home();
</script>
</body>
